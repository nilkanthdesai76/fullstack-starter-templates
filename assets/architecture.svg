<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#12161f" />
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14263d" />
      <stop offset="100%" stop-color="#0a1524" />
    </linearGradient>
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133d2a" />
      <stop offset="100%" stop-color="#0a1f15" />
    </linearGradient>
    <linearGradient id="cardEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143d38" />
      <stop offset="100%" stop-color="#0a1f1d" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="50" y="55" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">fullstack-starter-templates</text>
  <text x="50" y="80" font-size="13" font-weight="400" fill="#94a3b8">Production Docker Compose Stacks, Async FastAPI Backend &amp; Supabase Helpers</text>

  <!-- 3 Big Stack Blocks -->
  <!-- Block 1: Docker Compose Multi-Service -->
  <g filter="url(#shadow)">
    <rect x="50" y="115" width="280" height="470" rx="14" fill="url(#cardBlue)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="85" cy="150" r="16" fill="#38bdf8" fill-opacity="0.15" />
    <text x="85" y="156" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">🐳</text>
    <text x="115" y="156" font-size="16" font-weight="600" fill="#f8fafc">Docker Compose Stack</text>

    <text x="75" y="200" font-size="13" font-weight="600" fill="#38bdf8">FastAPI + Postgres + Redis</text>
    <text x="75" y="230" font-size="12" fill="#cbd5e1">• Production restart policies</text>
    <text x="75" y="255" font-size="12" fill="#cbd5e1">• PostgreSQL 16 health check</text>
    <text x="75" y="280" font-size="12" fill="#cbd5e1">• Persistent volume mounts</text>
    <text x="75" y="305" font-size="12" fill="#cbd5e1">• Redis 7 caching broker</text>
    <text x="75" y="330" font-size="12" fill="#cbd5e1">• Internal bridge networking</text>
    <text x="75" y="355" font-size="12" fill="#cbd5e1">• Zero manual setup required</text>

    <rect x="70" y="480" width="240" height="70" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="85" y="508" font-size="11" fill="#94a3b8"># Run entire stack:</text>
    <text x="85" y="530" font-size="12" font-weight="600" fill="#38bdf8">docker compose up -d</text>
  </g>

  <!-- Block 2: FastAPI Async API -->
  <g filter="url(#shadow)">
    <rect x="360" y="115" width="280" height="470" rx="14" fill="url(#cardGreen)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="395" cy="150" r="16" fill="#34d399" fill-opacity="0.15" />
    <text x="395" y="156" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">⚡</text>
    <text x="425" y="156" font-size="16" font-weight="600" fill="#f8fafc">FastAPI Microservice</text>

    <text x="385" y="200" font-size="13" font-weight="600" fill="#34d399">Python 3.11 Async Backend</text>
    <text x="385" y="230" font-size="12" fill="#cbd5e1">• Pydantic v2 typed schemas</text>
    <text x="385" y="255" font-size="12" fill="#cbd5e1">• Structured /health endpoints</text>
    <text x="385" y="280" font-size="12" fill="#cbd5e1">• Production CORS middleware</text>
    <text x="385" y="305" font-size="12" fill="#cbd5e1">• Auto Swagger/OpenAPI docs</text>
    <text x="385" y="330" font-size="12" fill="#cbd5e1">• Slim Docker container recipe</text>
    <text x="385" y="355" font-size="12" fill="#cbd5e1">• Uvicorn standard runner</text>

    <rect x="380" y="480" width="240" height="70" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="395" y="508" font-size="11" fill="#94a3b8"># Swagger docs:</text>
    <text x="395" y="530" font-size="12" font-weight="600" fill="#34d399">http://localhost:8000/docs</text>
  </g>

  <!-- Block 3: Supabase Auth & Storage -->
  <g filter="url(#shadow)">
    <rect x="670" y="115" width="280" height="470" rx="14" fill="url(#cardEmerald)" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="705" cy="150" r="16" fill="#2dd4bf" fill-opacity="0.15" />
    <text x="705" y="156" font-size="15" font-weight="700" fill="#2dd4bf" text-anchor="middle">⚡</text>
    <text x="735" y="156" font-size="16" font-weight="600" fill="#f8fafc">Supabase Helpers</text>

    <text x="695" y="200" font-size="13" font-weight="600" fill="#2dd4bf">Auth &amp; Storage Wrapper</text>
    <text x="695" y="230" font-size="12" fill="#cbd5e1">• Singleton client creation</text>
    <text x="695" y="255" font-size="12" fill="#cbd5e1">• Typed Auth: signUp, signIn</text>
    <text x="695" y="280" font-size="12" fill="#cbd5e1">• Session lifecycle management</text>
    <text x="695" y="305" font-size="12" fill="#cbd5e1">• Cloud file uploads with upsert</text>
    <text x="695" y="330" font-size="12" fill="#cbd5e1">• Public CDN URL generators</text>
    <text x="695" y="355" font-size="12" fill="#cbd5e1">• Clean error propagation</text>

    <rect x="690" y="480" width="240" height="70" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="705" y="508" font-size="11" fill="#94a3b8"># Clean upload:</text>
    <text x="705" y="530" font-size="12" font-weight="600" fill="#2dd4bf">await storage.uploadFile(...)</text>
  </g>
</svg>
